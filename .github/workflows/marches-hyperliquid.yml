# Lecture seule : liste les marchés d'actions de Hyperliquid (tous les « dex » HIP-3), pour choisir les spokes du hub.
name: Marchés Hyperliquid (lecture)
on:
  push:
    branches: [feature/hub-spokes]
    paths: [.github/workflows/marches-hyperliquid.yml]
permissions:
  contents: read
jobs:
  lister:
    runs-on: ubuntu-latest
    steps:
      - name: Annuaire SODAX et Yahoo pour la liste de Greg
        run: |
          curl -sL -A 'Mozilla/5.0' https://www.sodax.com/partners/asset-directory -o sodax.html
          for t in AAPL AMZN CRCL INTC SPCX ANT ANTH ANTHROPIC SPY AMD COIN IBM NOK BB NVDA; do
            n=$(grep -oE "[^A-Za-z]$t(x|on)?[^A-Za-z]" sodax.html | wc -l)
            ctx=$(grep -oE ".{0,60}[^A-Za-z]$t[^A-Za-z].{0,60}" sodax.html | head -1 | tr -d '\n' | cut -c1-140)
            y=$(curl -s -A 'Mozilla/5.0' "https://query1.finance.yahoo.com/v8/finance/chart/$t" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{const m=JSON.parse(d).chart.result[0].meta;console.log(m.regularMarketPrice,m.longName||m.shortName||'')}catch{console.log('absent')}})")
            echo "TICKER $t sodax=$n yahoo=[$y] ctx=[$ctx]"
          done

# Les 2 robots rapporteurs du prix d'Apple (voir robots/ et contracts/oracle-prix).
# SÉCURITÉ : tant que la variable du dépôt ROBOTS_ACTIFS ne vaut pas "oui", ils sont en LECTURE SEULE
# (ils lisent et affichent le prix, n'envoient rien). Les clés viennent des secrets GitHub, jamais du code.
name: Rapporteurs prix AAPL

on:
  schedule:
    - cron: '*/15 * * * *'   # Hyperliquid 24 h/24 ; Yahoo s'arrête seul hors séance de New York
  workflow_dispatch:
  # Essai en lecture seule depuis la branche de travail (jamais d'envoi sur un push).
  push:
    branches: [feature/oracle-gratuit]
    paths: ['robots/**', '.github/workflows/rapporteurs.yml']

permissions:
  contents: read

concurrency:
  group: rapporteurs
  cancel-in-progress: false

jobs:
  rapporter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: hyperliquid
            cle: RAPPORTEUR_CONTINU_CLE
          - source: yahoo
            cle: RAPPORTEUR_BOURSE_CLE
    name: Robot ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: robots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund
      - run: node rapporteur.mjs ${{ matrix.source }}
        env:
          ENVOYER: ${{ github.event_name != 'push' && vars.ROBOTS_ACTIFS == 'oui' && 'oui' || 'non' }}
          ORACLE_ID: ${{ vars.ORACLE_ID }}
          RAPPORTEUR_CLE: ${{ secrets[matrix.cle] }}
          FORCER_LECTURE: ${{ github.event_name == 'push' && 'oui' || 'non' }}

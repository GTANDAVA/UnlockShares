# Les 2 robots rapporteurs du prix de chaque action (voir robots/ et contracts/oracle-prix) : un oracle par action.
# Apple utilise la variable ORACLE_ID ; les autres actions ORACLE_ID_<TITRE> (par ex. ORACLE_ID_NVDA).
# Une action sans variable d'oracle reste en lecture seule.
# SÉCURITÉ : tant que la variable du dépôt ROBOTS_ACTIFS ne vaut pas "oui", ils sont en LECTURE SEULE
# (ils lisent et affichent le prix, n'envoient rien). Les clés viennent des secrets GitHub, jamais du code.
name: Rapporteurs prix actions

on:
  schedule:
    - cron: '*/5 * * * *'   # Hyperliquid 24 h/24 ; Yahoo s'arrête seul hors séance de New York
  workflow_dispatch:
  # Essai en lecture seule depuis la branche de travail (jamais d'envoi sur un push).
  push:
    branches: [feature/oracle-gratuit, feature/hub-spokes]
    paths: ['robots/**', '.github/workflows/rapporteurs.yml']

permissions:
  contents: read

concurrency:
  group: rapporteurs
  cancel-in-progress: false

jobs:
  rapporter:
    strategy:
      fail-fast: false
      matrix:
        include:
          - source: hyperliquid
            cle: RAPPORTEUR_CONTINU_CLE
          - source: yahoo
            cle: RAPPORTEUR_BOURSE_CLE
    name: Robot ${{ matrix.source }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: robots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --omit=dev --no-audit --no-fund
      # Les actions passent l'une après l'autre : un même robot (une même clé) ne peut pas envoyer
      # deux transactions en même temps (numéro de séquence du compte).
      - name: Une action après l'autre
        run: |
          code=0
          # Hyperliquid ne cote pas les ETF (SPY, EWY) : ils n'ont que Yahoo.
          if [ "${{ matrix.source }}" = yahoo ]; then titres="AAPL NVDA TSLA NOK SPY EWY"; else titres="AAPL NVDA TSLA NOK"; fi
          for titre in $titres; do
            if [ "$titre" = AAPL ]; then oracle="$ORACLE_AAPL"; else var="ORACLE_$titre"; oracle="${!var}"; fi
            envoyer=non
            if [ "$ACTIFS" = oui ] && [ -n "$oracle" ]; then envoyer=oui; fi
            TITRE=$titre ORACLE_ID="$oracle" ENVOYER=$envoyer node rapporteur.mjs ${{ matrix.source }} || code=1
          done
          exit $code
        env:
          ACTIFS: ${{ github.event_name != 'push' && vars.ROBOTS_ACTIFS == 'oui' && 'oui' || 'non' }}
          ORACLE_AAPL: ${{ vars.ORACLE_ID }}
          ORACLE_NVDA: ${{ vars.ORACLE_ID_NVDA }}
          ORACLE_TSLA: ${{ vars.ORACLE_ID_TSLA }}
          ORACLE_NOK: ${{ vars.ORACLE_ID_NOK }}
          ORACLE_SPY: ${{ vars.ORACLE_ID_SPY }}
          ORACLE_EWY: ${{ vars.ORACLE_ID_EWY }}
          RAPPORTEUR_CLE: ${{ secrets[matrix.cle] }}
          FORCER_LECTURE: ${{ github.event_name == 'push' && 'oui' || 'non' }}

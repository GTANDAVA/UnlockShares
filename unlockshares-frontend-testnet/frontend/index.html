<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Inter+Tight:wght@800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <title>UnlockShares</title>
    <!-- Thème : version nuit par défaut ; le choix du visiteur (bouton soleil / lune) est gardé dans ce navigateur. Lu avant l'affichage pour éviter un flash. -->
    <script>try { var t = localStorage.getItem('unlockshares.theme'); document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark' } catch (e) {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
